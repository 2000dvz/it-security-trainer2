<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <title>IT-Security-Beauftragte:r v1.4.2</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-2: #eef3f8;
      --text: #17202a;
      --muted: #64748b;
      --line: #d9e2ec;
      --brand: #0f766e;
      --brand-2: #115e59;
      --accent: #2563eb;
      --good: #15803d;
      --bad: #b91c1c;
      --warn: #b45309;
      --shadow: 0 18px 50px rgba(15, 23, 42, .08);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --panel: #182231;
      --panel-2: #223044;
      --text: #eef2f7;
      --muted: #aab6c7;
      --line: #314157;
      --brand: #2dd4bf;
      --brand-2: #5eead4;
      --accent: #60a5fa;
      --shadow: 0 18px 50px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .skip-link { position: absolute; left: -999px; top: 8px; background: var(--panel); padding: 10px; z-index: 10; }
    .skip-link:focus { left: 8px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
    .sidebar { background: #0f172a; color: #e5eef8; padding: 22px; display: flex; flex-direction: column; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 44px; height: 44px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; }
    .brand small { color: #9fb0c7; display: block; margin-top: 2px; }
    nav { display: grid; gap: 8px; }
    .nav-item { border: 0; background: transparent; color: inherit; text-align: left; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,.12); }
    .local-note { margin-top: auto; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 12px; color: #bdc9da; font-size: 14px; }
    .workspace { min-width: 0; }
    .topbar { padding: 20px 28px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: center; position: sticky; top: 0; z-index: 5; }
    .eyebrow { margin: 0 0 3px; color: var(--brand); font-weight: 700; font-size: 13px; text-transform: uppercase; }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: clamp(25px, 3vw, 36px); }
    h2 { font-size: 22px; }
    h3 { font-size: 17px; }
    main { padding: 28px; max-width: 1240px; margin: 0 auto; width: 100%; }
    .grid { display: grid; gap: 16px; }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .pad { padding: 18px; }
    .section { margin-top: 18px; }
    .muted { color: var(--muted); }
    .metric { display: grid; gap: 4px; }
    .metric strong { font-size: 30px; }
    .button, .icon-button { border: 1px solid transparent; border-radius: 8px; background: var(--brand); color: #fff; padding: 10px 14px; font-weight: 700; }
    .button.secondary, .icon-button.secondary { background: var(--panel-2); color: var(--text); border-color: var(--line); }
    .button.next { background: var(--accent); color: #fff; border-color: var(--accent); }
    .button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
    .button.danger { background: var(--bad); color: #fff; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .icon-button { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 14px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 10px 12px; }
    textarea { min-height: 78px; resize: vertical; }
    input[type="checkbox"] { width: auto; }
    .setting-grid { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 12px; }
    .checkline { display: flex; align-items: center; gap: 8px; color: var(--text); }
    .question-card { display: grid; gap: 16px; }
    .question-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { border-radius: 999px; padding: 5px 9px; background: var(--panel-2); color: var(--muted); font-size: 13px; font-weight: 700; }
    .pill.good { background: rgba(21,128,61,.13); color: var(--good); }
    .pill.bad { background: rgba(185,28,28,.13); color: var(--bad); }
    .pill.warn { background: rgba(180,83,9,.15); color: var(--warn); }
    .option { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; background: var(--panel); }
    .option.correct { border-color: rgba(21,128,61,.5); background: rgba(21,128,61,.08); }
    .option.wrong { border-color: rgba(185,28,28,.5); background: rgba(185,28,28,.08); }
    .feedback { border-left: 4px solid var(--brand); background: var(--panel-2); padding: 14px; border-radius: 8px; }
    .feedback.error { border-color: var(--bad); }
    .timer { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--brand-2); }
    .progress { height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--brand); width: 0; }
    .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .bar span { display: block; height: 100%; background: var(--accent); }
    .list { display: grid; gap: 10px; }
    .list-item { border: 1px solid var(--line); border-radius: 8px; padding: 13px; background: var(--panel); }
    .answer-grid { display: grid; gap: 8px; margin-top: 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 13px; }
    .menu-button { display: none; }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 20; transform: translateX(-100%); transition: transform .2s ease; }
      .sidebar.open { transform: translateX(0); }
      .menu-button { display: grid; }
      .topbar, main { padding-left: 16px; padding-right: 16px; }
      .cols-2, .cols-3, .setting-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
        const DEFAULT_QUESTIONS = [
      q(1,"Was muss bei der Konzeption bei der Sicherheit bei der Definition des Scopes beachtet werden?",["Eine klare Abgrenzung ist erforderlich", "Schnittstellen von externen Partner müssen berücksichtigt werden", "Der Scope ist ein unwesentlicher Bestandteil", "Welche Teile, Aufgaben bzw. kritische Geschäftsprozesse muss der Geltungsbereich beinhalten"],["A", "B", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(2,"Wie können von Unternehmen zu Unternehmen dokumentierte Informationen unterschieden werden?",["Es besteht eine Wechselwirkung und Komplexität bei den Prozessen", "In der Unternehmensgröße, angebotene Dienstleistungen, abgebildete Prozesse und Produkten", "Durch Vorgaben der Kammern", "Fachliche Qualifikation der Person"],["A", "B", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(3,"Welche Grundaufgaben sind in der IT-Sicherheit etabliert?",["Rechte nur im Bedarfsfall vergeben", "Komplexe Prozesse", "Leistungsstarke Server absichern", "Kosten / Nutzen"],["A", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(4,"Bei welchen Kontrollen müssen im Vorfeld evtl. die Persönlichkeitsrechte überprüft werden?",["Videoüberwachung", "Brandschutztüren", "Abgleichen von Biometrischen Punkten", "Durchführen von Personenkontrollen"],["A", "C", "D"],"IAM / Zugriff","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(5,"Welche Beispiele stellen organisatorische Schutzmaßnahmen dar?",["Aufbau eines Informationssicherheitsmanagementsystem", "Das IT-Risikomanagement", "Durchführen von Pentests", "Ein ausgearbeitetes Notfallmanagement"],["A", "B", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(6,"Welche Vorgabe für Audits wird zwischen 2 Zertifizierungsjahren (ISO 27001) muss ein Unternehmen eigenständig jährlich durchführen?",["4 pro Jahr", "Mindestens 1 Audit pro Jahr", "überhaupt keins", "pro Halbjahr 1"],["B"],"ISMS / ISO 27001","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(7,"Welche Prozesse werden in der IT-Security abgebildet?",["Ein Risikomanagement zu implementieren", "Ein Identitätsmanagement", "einen betrieblichen Eskalationspfad zu erstellen", "Eine Zugangs- und Zugriffskontrolle einrichten"],["B", "D"],"Überarbeitete Fragen","Quelle: Fehlerabgleich.docx. Diese Frage wurde gezielt aus dem Fehlerabgleich übernommen; im Übungsmodus muss die Auswahl exakt vollständig sein."),
      q(8,"Bei einem Logistik Unternehmen „Weltweite Lieferungen“ sind Sie als ISB beschäftigt. Das Management möchte, dass Sie ein ISMS implementieren, da durch die weltweiten Abhängigkeiten immer mehr Sicherheitsrisiken entstehen. Sie zeigen dem Management Ihre Einschätzungen mit dem Bezug zum BSI. Welche allgemeinen Einflussfaktoren sollen laut dem BSI vorhanden sein?",["Die Verantwortungsstrukturen und die Unternehmensstruktur", "Die Unternehmensziele mit der strategischen Ausrichtung des Unternehmens", "Das technische Know How von Mitarbeiter/innen", "Regelung der Zusammenarbeit mit externen Partnern"],["A", "B", "D"],"ISMS / ISO 27001","Quelle: Fehlerabgleich.docx. Diese Frage wurde gezielt aus dem Fehlerabgleich übernommen; im Übungsmodus muss die Auswahl exakt vollständig sein."),
      q(9,"Bei einem IT-Dienstleister übernehmen Sie die Verantwortung des Informationssicherheitsbeautragten, Diesen Unternehmen nimmt Cloud Serverfarmen in Betrieb. Bei der Planung müssen Sie auch die physische Sicherheit berücksichtigen zusätzlich tragen Sie die Verantwortung den Brandschutz. Welche Punkte sollten bei der Einführung eines Normkonformen ISMS (ISO 27001) berücksichtigt werden, damit die Informationen und die physische Sicherheit gewährleistet wird?",["Es sollte ein Brandschutzbeauftragte/r benannt werden", "Identifizierung und Dokumentation aller (branchenspezifischer, nationaler und lokaler) Brandschutzvorschriften und -normen", "Brandschutzmaßnahmen müssen von der IT Leitung beauftragt werden", "Der Einsatz und die Testung von Brandschutzanlagen"],["A", "B", "D"],"ISMS / ISO 27001","Quelle: Fehlerabgleich.docx. Diese Frage wurde gezielt aus dem Fehlerabgleich übernommen; im Übungsmodus muss die Auswahl exakt vollständig sein."),
      q(10,"Welche Begriffe können sie modernen Cyberangriffen (Malware) zuordnen?",["Würmer", "Viren", "virtuelle Maschinen", "Trojaner"],["A", "B", "D"],"Incident / Cyberangriffe","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(11,"Bei der „Jura Anwalts GmbH“ werden vertrauliche und sensible Informationen der Mandanten per E-Mail verschickt. Eine Veröffentlichung bei Verlust könnte schlimme Folgen mit sich bringen. Das Top Management beauftragt Sie als Informationssicherheitsbeautragten, die höchste Sicherheit der Vertraulichkeit dieser E-Mails zu gewährleisten. Welches ist das einzige Verfahren, welches sicherstellt, dass keine Zwischenstationen (z.B. Mailserver) und nur der Absender/in und der Empfänger/in den Inhalt lesen können?",["Eine Transportverschlüsselung zwischen E-Mail Servern implementieren", "Die End-to-End Verschlüsselung für die E-Mails verwenden (z.B. PGP)", "Den Mailserver immer auf den aktuellen Updatestand halten", "E-Mails nur mit einer bestehenden VPN Verbindung versenden"],["B"],"Risiko / Schutzziele","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(12,"Wer im Unternehmen muss den Auftrag erteilen, damit ein ISMS (ISO27001) eingeführt werden kann und ist auch für den langfristigen erfolgreich im Unternehmen bleibt?",["ISM", "ISB", "Die IT Abteilung", "Die Unternehmensführung"],["D"],"ISMS / ISO 27001","Quelle: Fehlerabgleich.docx. Diese Frage wurde gezielt aus dem Fehlerabgleich übernommen; im Übungsmodus muss die Auswahl exakt vollständig sein."),
      q(13,"Unter welchen Voraussetzungen entscheidet sich eine Organisation für die Umsetzung einer Kern-Absicherung?",["Das angestrebte Sicherheitsniveau orientiert sich ausschließlich an wirtschaftlichen Mindestanforderungen", "Es existiert nur eine begrenzte Anzahl besonders schutzbedürftiger Geschäftsprozesse", "Die Organisation verzichtet vollständig auf bestehende Sicherheitsmaßnahmen", "Kritische Prozesse mit erhöhtem Risiko können schnell erkannt und klar voneinander abgegrenzt werden"],["B", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(14,"Was beschreibt Multi-Faktor-Authentifizierung (MFA)?",["Kombination mehrerer unabhängiger Faktoren", "Erhöhung der Zugriffssicherheit", "Ausschließliche Nutzung von Passwörtern", "Zusätzliche Absicherung von Benutzerkonten"],["A", "B", "D"],"IAM / Zugriff","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(15,"Die „NovaSecure Systems GmbH“ entwickelt cloudbasierte Geschäftsanwendungen und plant die Einführung eines Informationssicherheitsmanagementsystems nach ISO/IEC 27001. Während der Projektplanung erklärt die Geschäftsführung, dass technische Schutzmaßnahmen allein nicht ausreichen und deshalb auch der sogenannte „Kontext der Organisation“ betrachtet werden muss. Welche Aspekte beschreibt die ISO/IEC 27001 typischerweise als Bestandteil des „Kontexts der Organisation“?",["Analyse interner Themen und Rahmenbedingungen, die Einfluss auf die Organisation haben", "Planung des jährlichen IT-Sicherheitsbudgets als alleiniger Schwerpunkt des ISMS", "Berücksichtigung externer Einflussfaktoren und Anforderungen des Unternehmens", "Operative Verfolgung und Identifikation potenzieller Angreifergruppen"],["A", "C"],"ISMS / ISO 27001","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(16,"Welche Maßnahmen eignen sich typischerweise, um die Integrität von Informationen sicherzustellen?",["Die ausschließliche Verwendung individueller Benutzerkonten gewährleistet automatisch die Integrität sämtlicher Informationen.", "Spiegelung kritischer Systeme zur Ausfallsicherheit", "Kryptografische Prüfsummen und Hashverfahren", "Automatische Skalierung von Cloud-Ressourcen"],["C"],"Risiko / Schutzziele","Quelle: Fehlerabgleich.docx. Diese Frage wurde gezielt aus dem Fehlerabgleich übernommen; im Übungsmodus muss die Auswahl exakt vollständig sein."),
      q(17,"Welche Aufgaben gehören zum Incident Management?",["Erkennung von Sicherheitsvorfällen", "Koordination von Reaktionen", "Analyse von Ursachen", "Entwicklung von Werbestrategien"],["A", "B", "C"],"Incident / Cyberangriffe","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(18,"Die „SecureVision Solutions GmbH“ bereitet aktuell eine Zertifizierung nach ISO/IEC 27001 vor. Die Geschäftsführung möchte sicherstellen, dass Mitarbeitende, deren Tätigkeiten Einfluss auf die Informationssicherheit haben, über geeignete Kompetenzen verfügen. Welche Maßnahmen fordert die ISO/IEC 27001 im Zusammenhang mit Kompetenzmanagement typischerweise von einer Organisation?",["Geeignete Nachweise über vorhandene Kompetenzen und Qualifikationen dokumentiert aufbewahren", "Kompetenzen ausschließlich bei Führungskräften regelmäßig überprüfen", "Erforderliche Kompetenzen für sicherheitsrelevante Tätigkeiten festlegen, welche unter Aufsicht die Informationssicherheitsleitungen beeinflussen können", "Sicherstellen, dass Mitarbeitende durch Ausbildung, Erfahrung oder Schulungen ausreichend qualifiziert sind"],["A", "C", "D"],"ISMS / ISO 27001","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(19,"Welche Risiken entstehen durch Schatten-IT?",["Fehlende Kontrolle über Systeme", "Unbekannte Anwendungen im Unternehmen", "Verbesserte zentrale Sicherheitssteuerung", "Erhöhte Angriffsflächen"],["A", "B", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(20,"Wie sollte die dokumentierte Information eines Informationsmanagementsystem innerhalb einer Organisation sinnvoll strukturiert und bereitgestellt werden?",["Dokumentierte Informationen sollten grundsätzlich nur in gedruckter Form verwaltet werden", "Der Zugriff auf ISMS-Dokumente sollte ausschließlich der Geschäftsleitung vorbehalten sein", "Inhalte sollten entsprechend ihrer Sensibilität und Schutzbedarfe klassifiziert werden", "Informationen sollten zielgruppenorientiert aufbereitet und den jeweiligen Verantwortungsbereichen passend bereitgestellt werden"],["C", "D"],"Überarbeitete Fragen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(21,"Welche Ziele verfolgen Sicherheitskennzahlen (KPIs)?",["Messbarkeit von Sicherheitsmaßnahmen", "Unterstützung von Entscheidungen", "Bewertung von Entwicklungen", "Ersatz von Audits"],["A", "B", "C"],"Kontrolle / Kennzahlen","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),
      q(22,"Welche Maßnahmen eignen sich, um Systeme auf mögliche unautorisierte Zugriffe oder Manipulationen zu überprüfen?",["Analyse sicherheitsrelevanter Protokolle und Logdateien", "Durchführung allgemeiner Zutrittskontrollen für Besucher", "Vergleich von System- und Registry-Daten mit definierten Referenzwerten", "Überwachung sicherheitskritischer Bereiche durch Videoaufzeichnungen"],["A", "C", "D"],"IAM / Zugriff","Quelle: Überarbeitete Quizfragen.docx. Im Übungsmodus muss die Auswahl exakt vollständig sein; es gibt keine Teilpunkte."),

            <label>Antwort C<input id="manual-c"></label>
            <label>Antwort D<input id="manual-d"></label>
            <label>Korrekte Antworten<input id="manual-correct" placeholder="z. B. B oder A,C,D"></label>
            <button class="button" id="add-manual">Frage speichern</button>
          </div>
        </div>
        <div class="card pad">
          <h2>Fragen per Datei importieren</h2>
          <p class="muted">Unterstützt JSON, TXT, MD, MD5 und einfache textbasierte PDF-Dateien. Pro Frage sind genau 4 Antwortmöglichkeiten erforderlich; 1 bis 3 davon müssen korrekt sein. Scans ohne eingebetteten Text können lokal nicht gelesen werden.</p>
          <input id="file-import" type="file" accept=".json,.txt,.md,.md5,.md.5,.pdf,application/json,text/plain,text/markdown,application/pdf">
          <div class="feedback section">
            <strong>Textformat</strong>
            <p>Eine Frage pro Block: <code>Frage:</code>, danach <code>A)</code> bis <code>D)</code>, <code>Korrekt:</code> und optional <code>Erklärung:</code>.</p>
          </div>
          <div id="import-result" class="section muted"></div>
        </div>
      </section>
      <section id="qlist" class="list section"></section>`;
      $("#search").addEventListener("input", renderQuestions);
      $("#add-manual").addEventListener("click", addManualQuestion);
      $("#file-import").addEventListener("change", importFile);
      renderQuestions();
    }
    function renderQuestions() {
      const term = ($("#search")?.value || "").toLowerCase();
      const rows = allQuestions().filter(q => (q.question + q.topic).toLowerCase().includes(term));
      $("#qlist").innerHTML = rows.map(item => `<div class="list-item"><div class="question-meta"><span class="pill">Frage ${item.number}</span><span class="pill">${item.topic}</span><span class="pill">Mehrfachauswahl möglich</span>${state.disabledIds.includes(item.id) ? `<span class="pill bad">deaktiviert</span>` : ""}${item.custom ? `<span class="pill warn">eigene Frage</span>` : `<span class="pill">Original</span>`}</div><h3>${escapeHtml(item.question)}</h3><div class="answer-grid">${item.options.map(o => `<div class="option ${o.correct ? "correct" : ""}"><span><strong>${o.id})</strong> ${escapeHtml(o.text)}${o.correct ? " · korrekt" : ""}</span></div>`).join("")}</div><p class="muted">Die richtigen Antworten sind in der Fragenbank markiert. In Übung und Prüfung bleibt die Bewertung exakt: alle richtigen und keine falschen Antworten.</p><div class="button-row"><button class="button ghost" onclick="toggleDisabled('${item.id}')">${state.disabledIds.includes(item.id) ? "Aktivieren" : "Deaktivieren"}</button>${item.custom ? `<button class="button ghost" onclick="deleteCustomQuestion('${item.id}')">Eigene Frage löschen</button>` : ""}</div></div>`).join("");
    }
    function qualityReport() {
      const seen = new Map(), notes = [];
      allQuestions().forEach(q => {
        const key = q.question.toLowerCase().replace(/\s+/g, " ").trim();
        if (seen.has(key)) notes.push(`Mögliches Duplikat: Frage ${seen.get(key)} und Frage ${q.number}`);
        seen.set(key, q.number);
        if (q.question.length > 360) notes.push(`Sehr langer Fragetext: Frage ${q.number}`);
        if (q.options.some(o => o.text.length < 4)) notes.push(`Sehr kurze Antwortoption: Frage ${q.number}`);
        if (q.options.length !== 4) notes.push(`Nicht genau 4 Antwortoptionen: Frage ${q.number}`);
        const correct = q.options.filter(o => o.correct).length;
        if (correct < 1 || correct > 3) notes.push(`Ungewöhnliches Lösungsmuster: Frage ${q.number}`);
      });
      return notes.length ? notes.slice(0, 20).map(n => `<div class="list-item"><span class="pill warn">Hinweis</span> ${escapeHtml(n)}</div>`).join("") : `<div class="list-item"><span class="pill good">OK</span> Keine auffälligen Strukturprobleme gefunden.</div>`;
    }
    function analysis() {
      const exams = state.history.filter(h=>h.mode==="exam");
      app.innerHTML = `<section class="grid cols-3">${metric("Gespeicherte Ergebnisse", state.history.length, "lokal im Browser")}${metric("Bestanden", exams.filter(e=>e.passed).length, "Prüfungssimulationen")}${metric("Fehlerfragen", state.repeatIds.length, "für Wiederholung")}</section><section class="card pad section"><h2>Themenanalyse</h2><div class="list section">${weakTopics(true).map(w=>`<div class="list-item"><strong>${w.topic}</strong><p>${w.correct}/${w.total} richtig · ${w.rate}%</p><div class="bar"><span style="width:${w.rate}%"></span></div></div>`).join("") || `<p class="muted">Noch keine Ergebnisse.</p>`}</div></section><section class="card pad section"><h2>Verlauf</h2><div class="list">${state.history.slice().reverse().map(h=>`<div class="list-item"><strong>${h.mode === "exam" ? "Prüfung" : "Übung"} · ${new Date(h.date).toLocaleString("de-DE")}</strong><p>${h.percent}% · ${h.correct}/${h.total} richtig · ${fmt(h.durationSeconds)}</p></div>`).join("") || `<p class="muted">Noch keine Ergebnisse.</p>`}</div><div class="button-row section"><button class="button danger" onclick="resetStats()">Lernstand zurücksetzen</button></div></section>`;
    }
    function settings() {
      app.innerHTML = `<section class="card pad"><h2>Einstellungen</h2>${settingsPanel("exam")}<div class="button-row section"><button class="button" onclick="saveSettingsOnly()">Speichern</button><button class="button secondary" onclick="exportData()">Ergebnisse exportieren</button></div></section><section class="card pad section"><h2>Importverlauf</h2><div class="list">${state.importReports.slice().reverse().map(r=>`<div class="list-item"><strong>${escapeHtml(r.file || "Import")}</strong><p>${new Date(r.date).toLocaleString("de-DE")} · ${r.accepted} übernommen · ${r.rejected} abgelehnt · ${r.total} erkannt</p></div>`).join("") || `<p class="muted">Noch keine Importe.</p>`}</div></section>`;
    }
    function saveSettingsOnly(){ readRunSettings(); render("dashboard"); }
    function exportData(){
      const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), appVersion:APP_VERSION, questions:allQuestions(), history:state.history, repeatIds:state.repeatIds, uncertainIds:state.uncertainIds, disabledIds:state.disabledIds, notes:state.notes, importReports:state.importReports, settings:state.settings }, null, 2)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tuev-it-sicherheit-lernstand.json"; a.click(); URL.revokeObjectURL(a.href);
    }
    function resetStats(){ if(confirm("Lernstand und Ergebnisse wirklich löschen?")){ state.history=[]; state.repeatIds=[]; save(); render("analysis"); } }
    function startRepeat(){ const ids = prioritizedRepeatIds(); if(!ids.length){ alert("Aktuell gibt es keine Fehlerfragen zur Wiederholung."); return; } render("practice"); setTimeout(()=>startPractice(ids), 0); }
    function startReview(ids){ if(!ids.length){ alert("Keine falschen Fragen in dieser Prüfung."); return; } render("practice"); setTimeout(()=>startPractice(ids), 0); }
    function questionBank(){ return [...DEFAULT_QUESTIONS, ...state.customQuestions].filter(q => !state.disabledIds.includes(q.id)); }
    function allQuestions(){ return [...DEFAULT_QUESTIONS, ...state.customQuestions]; }
    function topics(){ return [...new Set(questionBank().map(q => q.topic))].sort((a,b)=>a.localeCompare(b, "de")); }
    function filteredBank(){ const t = state.settings.topic || "Alle"; return t === "Alle" ? questionBank() : questionBank().filter(q => q.topic === t); }
    function noteHtml(item){ return `<section class="card pad section"><label>Meine Notiz zu dieser Frage<textarea onchange="saveNote('${item.id}', this.value)" placeholder="Eigene Eselsbrücke, Unsicherheit oder Merksatz">${escapeHtml(state.notes[item.id] || "")}</textarea></label></section>`; }
    function saveNote(id, value){ state.notes[id] = value; save(); }
    function markUncertain(id){ if(!state.uncertainIds.includes(id)) state.uncertainIds.push(id); if(!state.repeatIds.includes(id)) state.repeatIds.push(id); save(); alert("Als unsicher markiert und zur Wiederholung vorgemerkt."); }
    function toggleDisabled(id){ if(state.disabledIds.includes(id)) state.disabledIds = state.disabledIds.filter(x => x !== id); else state.disabledIds.push(id); save(); renderQuestions(); }
    function prioritizedRepeatIds(){
      const wrongCounts = new Map();
      const slowIds = [];
      state.history.flatMap(h => h.details || []).forEach(d => { if(!d.correct) wrongCounts.set(d.questionId, (wrongCounts.get(d.questionId) || 0) + 1); if ((d.responseTimeSeconds || 0) >= 90) slowIds.push(d.questionId); });
      return [...new Set([...state.repeatIds, ...state.uncertainIds, ...slowIds])]
        .filter(id => questionBank().some(q => q.id === id))
        .sort((a,b) => (wrongCounts.get(b)||0) - (wrongCounts.get(a)||0) || (state.uncertainIds.includes(b) - state.uncertainIds.includes(a)));
    }
    function exportReport(id){
      const result = state.history.find(h => h.id === id);
      if(!result) return;
      const rows = result.details.map(d => {
        const q = allQuestions().find(item => item.id === d.questionId);
        return `<tr><td>${q?.number || ""}</td><td>${escapeHtml(q?.topic || "")}</td><td>${d.correct ? "richtig" : "falsch"}</td><td>${escapeHtml((d.chosen || []).join(", ") || "keine")}</td><td>${escapeHtml(q ? correctIds(q).join(", ") : "")}</td><td>${fmt(d.responseTimeSeconds || 0)}</td></tr>`;
      }).join("");
      const html = `<!doctype html><html lang="de"><meta charset="utf-8"><title>Prüfungsbericht</title><body><h1>Prüfungsbericht IT-Security-Beauftragte:r</h1><p>${new Date(result.date).toLocaleString("de-DE")} · ${result.percent}% · ${result.passed ? "bestanden" : "nicht bestanden"} · ${fmt(result.durationSeconds)}</p><table border="1" cellspacing="0" cellpadding="6"><tr><th>Nr.</th><th>Thema</th><th>Status</th><th>Gewählt</th><th>Korrekt</th><th>Zeit</th></tr>${rows}</table></body></html>`;
      const blob = new Blob([html], {type:"text/html"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pruefungsbericht-${result.date.slice(0,10)}.html`; a.click(); URL.revokeObjectURL(a.href);
    }
    function handleKeys(event) {
      if (["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName)) return;
      const key = event.key.toUpperCase();
      if (["A","B","C","D"].includes(key)) {
        const el = document.querySelector(`[name=answer][value="${key}"]`);
        if (el) { el.checked = !el.checked; event.preventDefault(); }
      }
      if (event.key === "Enter") {
        const next = document.querySelector(".button.next");
        const answers = document.querySelector("[name=answer]");
        if (next) next.click();
        else if (answers && state.practice) submitPractice();
      }
    }
    function addManualQuestion() {
      const texts = ["a","b","c","d"].map(x => $(`#manual-${x}`).value.trim()).filter(Boolean);
      const correct = $("#manual-correct").value.toUpperCase().split(/[\s,;]+/).filter(Boolean);
      const item = normalizeQuestion({
        question: $("#manual-question").value.trim(),
        topic: $("#manual-topic").value.trim() || "Eigene Fragen",
        explanation: $("#manual-explanation").value.trim() || "Eigene Frage ohne hinterlegte Erklärung.",
        options: texts.map((text, i) => ({ id: String.fromCharCode(65 + i), text, correct: correct.includes(String.fromCharCode(65 + i)) }))
      });
      if (!item.valid) return alert(item.error);
      state.customQuestions.push(item.question);
      save();
      ["question","topic","explanation","a","b","c","d","correct"].forEach(x => $(`#manual-${x}`).value = "");
      renderQuestions();
    }
    async function importFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const lowerName = file.name.toLowerCase();
      const ext = lowerName.endsWith(".md.5") ? "md5" : lowerName.split(".").pop();
      const target = $("#import-result");
      try {
        let imported;
        if (ext === "json") {
          imported = parseJsonQuestions(await file.text());
        } else if (ext === "pdf") {
          imported = parseTextQuestions(extractPdfText(await file.arrayBuffer()));
        } else if (["txt","md","md5"].includes(ext)) {
          imported = parseTextQuestions(await file.text());
        } else {
          throw new Error("Dieses Format wird nicht unterstützt.");
        }
        if (!imported.length) throw new Error("Keine gültigen Fragen gefunden.");
        const preview = state._lastImportReport || { accepted:imported.length, rejected:0, total:imported.length };
        if (!confirm(`Importvorschau:\n${preview.total} Blöcke erkannt\n${preview.accepted} gültige Fragen\n${preview.rejected} abgelehnt\n\nImport jetzt übernehmen?`)) {
          target.textContent = "Import abgebrochen.";
          return;
        }
        state.customQuestions.push(...imported);
        state.importReports.push({ date:new Date().toISOString(), file:file.name, ...(state._lastImportReport || { accepted:imported.length, rejected:0, total:imported.length }) });
        state.importReports = state.importReports.slice(-10);
        save();
        const report = state._lastImportReport || { accepted: imported.length, rejected: 0, total: imported.length };
        target.textContent = `${report.accepted} Frage(n) importiert, ${report.rejected} abgelehnt, ${report.total} erkannt.`;
        renderQuestions();
      } catch (error) {
        target.textContent = `Import fehlgeschlagen: ${error.message}`;
      } finally {
        event.target.value = "";
      }
    }
    function parseJsonQuestions(text) {
      const raw = JSON.parse(text);
      const list = Array.isArray(raw) ? raw : Array.isArray(raw.questions) ? raw.questions : [];
      const mapped = list.map(normalizeQuestion);
      state._lastImportReport = { total:list.length, accepted:mapped.filter(item => item.valid).length, rejected:mapped.filter(item => !item.valid).length };
      return mapped.filter(item => item.valid).map(item => item.question);
    }
    function parseTextQuestions(text) {
      const cleaned = text.replace(/\r/g, "").replace(/☐/g, "\n").replace(/([A-F]\))/g, "\n$1");
      const blocks = cleaned.split(/\n\s*(?=(?:Frage|Question)\s*:|\d+[\.)]\s+)/i).map(x => x.trim()).filter(Boolean);
      const parsed = [];
      for (const block of blocks) {
        const lines = block.split("\n").map(x => x.trim()).filter(Boolean);
        const optionLines = lines.filter(line => /^[A-F][\).:-]\s+/i.test(line));
        if (!optionLines.length) continue;
        const firstOption = lines.findIndex(line => /^[A-F][\).:-]\s+/i.test(line));
        const questionText = lines.slice(0, firstOption).join(" ").replace(/^(Frage|Question)\s*:\s*/i, "").replace(/^\d+[\.)]\s*/, "").trim();
        const correctLine = lines.find(line => /^(Korrekt|Richtig|Correct|Antwort)\s*:/i.test(line)) || "";
        const explanationLine = lines.find(line => /^(Erklärung|Begründung|Explanation)\s*:/i.test(line)) || "";
        const correct = (correctLine.match(/[A-F]/gi) || []).map(x => x.toUpperCase());
        const options = optionLines.map(line => {
          const id = line[0].toUpperCase();
          const marked = /^[A-F][\).:-]\s*(\*|\[x\]|x\s)/i.test(line);
          return { id, text: line.replace(/^[A-F][\).:-]\s*(\*|\[x\]|x\s)?/i, "").trim(), correct: correct.includes(id) || marked };
        });
        const item = normalizeQuestion({ question: questionText, topic: "Import", explanation: explanationLine.replace(/^[^:]+:\s*/, "") || "Importierte Frage ohne hinterlegte Erklärung.", options });
        if (item.valid) parsed.push(item.question);
      }
      state._lastImportReport = { total:blocks.length, accepted:parsed.length, rejected:Math.max(0, blocks.length - parsed.length) };
      return parsed;
    }
    function extractPdfText(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const chunks = [];
      binary.replace(/\(([^()]*)\)\s*Tj/g, (_, t) => chunks.push(t));
      binary.replace(/\[((?:.|\n)*?)\]\s*TJ/g, (_, group) => group.replace(/\(([^()]*)\)/g, (__, t) => chunks.push(t)));
      const text = chunks.join("\n").replace(/\\([()\\])/g, "$1").replace(/\\n/g, "\n");
      if (!text.trim()) throw new Error("Aus dieser PDF konnte lokal kein Text extrahiert werden. Bitte als TXT, MD oder JSON exportieren.");
      return text;
    }
    function normalizeQuestion(raw) {
      const question = String(raw.question || raw.frage || "").trim();
      const sourceOptions = raw.options || raw.antworten || [];
      const options = sourceOptions.map((o, i) => ({
        id: (o.id || String.fromCharCode(65 + i)).toUpperCase(),
        text: String(o.text || o.answer || o.antwort || "").trim(),
        correct: Boolean(o.correct ?? o.richtig)
      })).filter(o => o.text);
      const correctCount = options.filter(o => o.correct).length;
      if (!question) return { valid:false, error:"Bitte einen Fragetext angeben." };
      if (options.length !== 4) return { valid:false, error:"Eine Frage braucht genau 4 Antwortmöglichkeiten." };
      if (correctCount < 1) return { valid:false, error:"Mindestens eine Antwort muss korrekt sein." };
      if (correctCount > 3) return { valid:false, error:"Maximal 3 Antworten dürfen korrekt sein." };
      const number = DEFAULT_QUESTIONS.length + state.customQuestions.length + 1;
      return { valid:true, question: { id:`custom-${Date.now()}-${Math.random().toString(16).slice(2)}`, number, custom:true, question, topic: String(raw.topic || raw.thema || "Eigene Fragen").trim(), explanation: String(raw.explanation || raw.erklärung || raw.begruendung || "Eigene Frage ohne hinterlegte Erklärung.").trim(), type: "choice", options } };
    }
    function deleteCustomQuestion(id) {
      if (!confirm("Eigene Frage wirklich löschen?")) return;
      state.customQuestions = state.customQuestions.filter(q => q.id !== id);
      state.repeatIds = state.repeatIds.filter(qid => qid !== id);
      save();
      renderQuestions();
    }
    function prepare(items, s) {
      const qs = s.shuffleQuestions ? shuffle(items) : [...items];
      return qs.map(item => ({...item, options: s.shuffleAnswers ? shuffle(item.options) : [...item.options]}));
    }
    function selected(){ return [...document.querySelectorAll("[name=answer]:checked")].map(i=>i.value).sort(); }
    function restoreChecks(ids){ ids.forEach(id => { const el = document.querySelector(`[name=answer][value="${id}"]`); if(el) el.checked = true; }); }
    function evaluate(item, chosen) { const a = correctIds(item).sort(); const b = [...chosen].sort(); return { correct: a.length === b.length && a.every((v,i)=>v===b[i]), chosen:b }; }
    function correctIds(item){ return item.options.filter(o=>o.correct).map(o=>o.id).sort(); }
    function weakTopics(all=false) {
      const map = new Map();
      state.history.flatMap(h=>h.details).forEach(d => { const q = allQuestions().find(x=>x.id===d.questionId); if(!q) return; const m = map.get(q.topic) || {topic:q.topic,total:0,correct:0}; m.total++; if(d.correct)m.correct++; map.set(q.topic,m); });
      return [...map.values()].map(x=>({...x, rate: x.total ? Math.round(x.correct/x.total*100) : 0})).filter(x=>all || x.rate < 80).sort((a,b)=>a.rate-b.rate || b.total-a.total);
    }
    function weekGoals() {
      const stats = weakTopics(true);
      return topics().filter(t => /Kurswoche|Ergänzungsfragen/.test(t)).map(t => {
        const total = questionBank().filter(q => q.topic === t).length;
        const s = stats.find(x => x.topic === t) || {total:0, rate:0};
        return `<div class="list-item"><strong>${escapeHtml(t)}</strong><p>${s.total}/${total} bearbeitet · ${s.rate}% richtig</p><div class="bar"><span style="width:${total ? Math.min(100, Math.round(s.total / total * 100)) : 0}%"></span></div></div>`;
      }).join("");
    }
    function metric(label, value, sub){ return `<div class="card pad metric"><span class="muted">${label}</span><strong>${value}</strong><span class="muted">${sub}</span></div>`; }
    function resultMini(r){ return `<p><strong>${r.percent}%</strong> · ${r.passed ? "bestanden" : "nicht bestanden"}</p><p class="muted">${r.correct}/${r.total} richtig, ${fmt(r.durationSeconds)} Zeitverbrauch</p>`; }
    function fmt(seconds){ seconds = Math.max(0, seconds || 0); const m = Math.floor(seconds/60), s = seconds%60; return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
    function shuffle(arr){ return [...arr].map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
    function clamp(n,min,max){ return Math.max(min, Math.min(max, Number.isFinite(n) ? n : min)); }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
  </script>
</body>
